<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заметки по статьям</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f7f6f3;--surf:#fff;--surf2:#f1efe9;--line:#e2dfd6;--line2:#cfcabb;--tx:#23211d;--tx2:#6b6760;--tx3:#938d82;
--acc:#185fa5;--accbg:#e6f1fb;--warn:#854f0b;--warnbg:#faeeda;--ok:#3b6d11;--okbg:#eaf3de;--hi:#ffe9a8;--mark:rgba(255,196,0,.45);
--pinkbg:#fbeaf0;--violetbg:#eeedfe;--tealbg:#e1f5ee;--graybg:#efede7}
html[data-dark]{--bg:#1b1b1a;--surf:#232322;--surf2:#2b2b29;--line:#383835;--line2:#4a4a46;--tx:#eceae5;--tx2:#a8a49c;--tx3:#817d75;
--acc:#85b7eb;--accbg:#143047;--warn:#fac775;--warnbg:#3a2b10;--ok:#c0dd97;--okbg:#22300f;--hi:#5b4a14;
--pinkbg:#3a1c28;--violetbg:#241f3f;--tealbg:#123029;--graybg:#2f2f2c}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--surf);border:1px solid var(--line2);border-radius:6px;padding:4px 9px;cursor:pointer}
button:hover{background:var(--surf2)}button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
button.mini{padding:2px 7px;font-size:12px}
input[type=text],input[type=search],input[type=number],select{background:var(--surf);border:1px solid var(--line2);border-radius:6px;padding:5px 8px}
header{border-bottom:1px solid var(--line);background:var(--surf);padding:7px 10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
header h1{font:500 15px/1 inherit;margin:0 4px 0 0;white-space:nowrap}
#q{flex:1;min-width:170px}
.bar{height:7px;background:var(--surf2);border-radius:4px;overflow:hidden;width:130px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
main{flex:1;display:grid;grid-template-columns:270px minmax(0,1fr) 0;min-height:0}
main.pdf{grid-template-columns:270px minmax(0,1fr) minmax(0,1.25fr)}
main.pdfmax{grid-template-columns:0 0 minmax(0,1fr)}
#list{overflow:auto;border-right:1px solid var(--line);background:var(--surf)}
#note{overflow:auto;padding:14px 20px 120px}
#pdf{border-left:1px solid var(--line);background:var(--surf2);display:flex;flex-direction:column;overflow:hidden}
.filters{padding:7px 9px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px;background:var(--surf2);position:sticky;top:0;z-index:3}
.filters select{padding:3px 5px;font-size:12px;max-width:124px}
.cnt{font-size:12px;color:var(--tx2);padding:5px 10px}
.it{padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:7px;align-items:flex-start}
.it:hover{background:var(--surf2)}.it.sel{background:var(--accbg)}
.it b{font-weight:500;display:block;font-size:13px}.it small{color:var(--tx2);font-size:11.5px;display:block}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:5px;border:1px solid var(--line2)}
.d0{background:transparent}.d1{background:var(--warn);border-color:var(--warn)}.d2{background:var(--ok);border-color:var(--ok)}
/* ---- редактор ---- */
.doc{max-width:860px;margin-left:46px}
.ttl{font:500 19px/1.35 inherit;margin:0 0 3px}
.meta{color:var(--tx2);font-size:13px}
.tags{margin:7px 0;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;background:var(--surf2);border:1px solid var(--line);color:var(--tx2);border-radius:5px;padding:1px 7px;cursor:pointer}
.tag:hover{border-color:var(--acc);color:var(--acc)}
.tag .tx{border:0;background:none;padding:0 0 0 5px;margin:0;color:var(--tx3);font-size:11px;cursor:pointer;line-height:1}
.tag .tx:hover{color:var(--text-danger,#a32d2d)}
.tag.addt{border-style:dashed;color:var(--tx3)}
.tag.sel{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.tagin{font-size:11.5px;padding:1px 6px;border:1px solid var(--acc);border-radius:5px;width:150px}
.tb{position:sticky;top:0;z-index:5;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:5px 6px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
.tb .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.blk{position:relative;padding:3px 8px 3px 26px;border-radius:6px;outline:none;min-height:1.6em}
.blk:hover{background:var(--surf2)}
.blk:focus{background:var(--surf2);box-shadow:inset 2px 0 0 var(--acc)}
.blk.h{font:500 15.5px/1.4 inherit;margin:16px 0 2px;padding-left:26px}
.blk.h.net{color:var(--acc)}
.blk.li{padding-left:34px}
.blk.li:before{content:"•";position:absolute;left:19px;color:var(--tx3)}
.blk[data-c]{border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0}
.blk[data-c]:hover,.blk[data-c]:focus{filter:brightness(.98)}
.blk[data-c="blue"]{background:var(--accbg)}
.blk[data-c="green"]{background:var(--okbg)}
.blk[data-c="yellow"]{background:var(--warnbg)}
.blk[data-c="pink"]{background:var(--pinkbg)}
.blk[data-c="violet"]{background:var(--violetbg)}
.blk[data-c="teal"]{background:var(--tealbg)}
.blk[data-c="gray"]{background:var(--graybg)}
.blk.s-2{font-size:.82em}.blk.s-1{font-size:.91em}.blk.s1{font-size:1.12em}.blk.s2{font-size:1.28em}.blk.s3{font-size:1.5em}
.sw{width:19px;height:19px;border-radius:5px;border:1px solid var(--line2);cursor:pointer;padding:0}
.sw:hover{border-color:var(--acc)}
.qrow{display:flex;gap:6px;align-items:flex-start;margin:4px 0 4px 26px}
.qrow .blk{flex:1;border-left:2px solid var(--acc);border-radius:0 6px 6px 0;background:var(--accbg);color:var(--acc);font-style:italic;font-size:13px;padding-left:10px}
.qpg{width:62px;padding:2px 4px;font-size:12px}
.gut{position:absolute;left:-46px;top:1px;display:none;gap:2px}
.blk:hover .gut,.blk:focus .gut{display:flex}
.gut button{padding:0 4px;font-size:11px;line-height:1.5;border-radius:4px}
.imgb{margin:8px 0 8px 26px;max-width:100%}
.imgb img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
#symbox{display:none;position:absolute;z-index:9;background:var(--surf);border:1px solid var(--line2);border-radius:8px;padding:7px;max-width:340px;box-shadow:0 6px 24px rgba(0,0,0,.14)}
#symbox span{display:inline-block;padding:3px 7px;cursor:pointer;border-radius:5px;font-size:15px}
#symbox span:hover{background:var(--accbg)}
/* ---- pdf ---- */
.pbar{padding:5px 7px;border-bottom:1px solid var(--line);display:flex;gap:5px;align-items:center;background:var(--surf);flex-wrap:wrap}
.pbar span{font-size:12.5px;color:var(--tx2)}
#pwrap{flex:1;overflow:auto;display:flex;justify-content:center;padding:10px;background:var(--surf2)}
#pstage{position:relative;box-shadow:0 2px 10px rgba(0,0,0,.14);height:max-content;background:#fff}
#pcv{display:block}
#ptext{position:absolute;text-align:initial;inset:0;overflow:hidden;line-height:1;transform-origin:0 0;
 -webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none}
#ptext span,#ptext br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0;margin:0}
#ptext span.hl{background:var(--mark);border-radius:2px}
#ptext ::selection{background:rgba(24,95,165,.33)}
#ptext .endOfContent{display:block;position:absolute;left:0;top:100%;right:0;bottom:0;z-index:-1;cursor:default;user-select:none}
#ptext.selecting .endOfContent{top:0}
.pmsg{padding:14px;color:var(--tx2);font-size:13px;line-height:1.6}
.pmsg b{color:var(--tx)}
#qbar{padding:5px 9px;border-bottom:1px solid var(--line);background:var(--hi);color:#23211d;font-size:12.5px;display:none}
#qbar.show{display:block}
/* ---- первый запуск ---- */
#boot{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center}
#boot .card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:22px 26px;max-width:620px}
#boot h2{font:500 18px/1.3 inherit;margin:0 0 8px}
#boot p{color:var(--tx2);margin:6px 0}
.tr{margin:8px 0;padding:9px 11px;border:1px dashed var(--line2);border-radius:8px;background:var(--surf2);font-size:13.5px;white-space:pre-wrap;display:none}
.tr.show{display:block}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:9px 0}
#tagbox{display:none;position:absolute;z-index:9;background:var(--surf);border:1px solid var(--line2);border-radius:8px;padding:9px;max-width:620px;max-height:50vh;overflow:auto;box-shadow:0 6px 24px rgba(0,0,0,.14)}
.sv{font-size:12px;color:var(--tx3);flex:0 0 118px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#progTx{flex:0 0 162px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0}
#symbox{line-height:1.5}
#symbox .sg{font-size:11px;color:var(--tx3);margin:5px 2px 2px;display:block}
</style>
</head>
<body>
<header>
<h1>Заметки по статьям</h1>
<input id="q" type="search" placeholder="поиск: дегидрин, Haimi, 2017, CK2…">
<button id="btnNet">⚡ Для сети дегидринов</button>
<div class="bar" title="прочитано"><i id="prog" style="width:0"></i></div>
<span class="cnt" id="progTx"></span>
<button id="btnPdf">PDF</button>
<button id="btnFsm" title="уменьшить текст заметок">A−</button>
<button id="btnFsp" title="увеличить текст заметок">A+</button>
<button id="btnDark" title="тёмная тема">◐</button>
<button id="btnSave" title="сохранить файл заметок на диск">Сохранить файл</button>
<button id="btnLoad" title="загрузить файл заметок">Загрузить</button>
<span class="sv" id="sv"></span>
<input id="fileData" type="file" accept=".json" hidden>
</header>
<main id="main">
<div id="list">
 <div class="filters">
  <select id="fFolder"></select>
  <select id="fStatus"><option value="">Все: прочитано и нет</option><option value="0">Не читала</option><option value="1">Читаю</option><option value="2">Прочитано</option><option value="01">Не прочитано</option></select>
  <select id="fRel"><option value="">Любая важность</option><option value="3">★★★ главные</option><option value="23">★★ и выше</option></select>
  <select id="fSort"><option value="rel">Сортировка: важность</option><option value="year">год</option><option value="au">автор</option><option value="folder">папка</option></select>
  <button id="btnTags" class="mini">Теги</button>
 </div>
 <div class="cnt" id="cnt"></div>
 <div id="items"></div>
</div>
<div id="note"></div>
<div id="pdf">
 <div class="pbar">
  <button id="pPrev" class="mini">◀</button>
  <input id="pIn" type="number" min="1" style="width:58px;padding:2px 4px;font-size:12px">
  <span id="pTot">/ —</span>
  <button id="pNext" class="mini">▶</button>
  <span class="sep"></span>
  <button id="pZo" class="mini">−</button><span id="pZt">100%</span><button id="pZi" class="mini">+</button>
  <button id="pFit" class="mini">по ширине</button>
  <span class="sep"></span>
  <button id="pSel" class="mini" title="перевести выделенный в PDF текст">EN→RU выделенное</button>
  <button id="pQuote" class="mini" title="сделать из выделенного текста цитату в заметке">В цитату</button>
  <button id="pWide" class="mini" title="PDF на весь экран">⤢</button>
  <button id="pFold" class="mini">Свернуть</button>
 </div>
 <div id="qbar"></div>
 <div id="pwrap"><div id="pstage"><canvas id="pcv"></canvas><div id="ptext"></div></div></div>
 <div class="pmsg" id="pmsg"></div>
</div>
</main>
<div id="tagbox"></div>
<div id="symbox"></div>
<div id="boot"><div class="card">
 <h2>Первый запуск</h2>
 <p>Заметки хранятся у тебя на компьютере, в файле <b>notes_data.json</b> рядом с этой страницей. Загрузи его один раз — дальше страница будет помнить сама.</p>
 <div class="row">
  <button id="bLoad">Загрузить notes_data.json</button>
  <button id="bEmpty">Начать с пустого</button>
 </div>
 <p class="sv">Файл никуда не уходит: всё остаётся в твоём браузере и на диске.</p>
</div></div>
<script src="pdfjs/pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s),E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const LSget=k=>{try{return localStorage.getItem(k)}catch(e){return null}},LSset=(k,v)=>{try{localStorage.setItem(k,v);return 1}catch(e){return 0}};
const KEY='dhn_doc_v2';
let DOC=null, cur=null, netOnly=false, curTag='', files={}, dirty=false;

/* ---------- хранение ---------- */
let svT=null;
function save(){dirty=true;$('#sv').textContent='…';clearTimeout(svT);svT=setTimeout(()=>{
  const ok=LSset(KEY,JSON.stringify(DOC));
  $('#sv').textContent=ok?'сохранено':'НЕ СОХРАНЕНО';$('#sv').title=ok?'заметки сохранены в браузере':'в браузере кончилось место — нажми «Сохранить файл»';
},500)}
function loadDoc(j){
  DOC=j; window.DOC=DOC;
  const MIG={call:'blue',ok:'green',warn:'yellow'};
  DOC.papers.forEach(p=>{p.status=p.status||0;
    p.blocks.forEach(b=>{if(MIG[b.t]){b.c=b.c||MIG[b.t];b.t='p'}});
    p._h=hay(p)});
  $('#boot').style.display='none'; buildFolders(); renderList();
  if(DOC.papers.length)open_(DOC.papers[0]);
}
function hay(p){
  return (p.title+' '+p.authors+' '+p.year+' '+(p.journal||'')+' '+p.tags.join(' ')+' '+p.file+' '+
    p.blocks.map(b=>(b.x||'').replace(/<[^>]+>/g,' ')).join(' ')).toLowerCase();
}
/* ---------- список ---------- */
function buildFolders(){
  const f=$('#fFolder'); f.textContent=''; f.append(new Option('Все папки',''));
  [...new Set(DOC.papers.map(p=>p.folder))].sort().forEach(x=>f.append(new Option(x+' ('+DOC.papers.filter(p=>p.folder===x).length+')',x)));
}
const isNet=p=>p.blocks.some(b=>b.t==='h'&&/сети DHN/i.test(b.x||''));
function filtered(){
  const q=$('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const fo=$('#fFolder').value,ss=$('#fStatus').value,re=$('#fRel').value;
  let r=DOC.papers.filter(p=>{
    if(fo&&p.folder!==fo)return 0;
    if(ss&&!ss.includes(String(p.status||0)))return 0;
    if(re&&!re.includes(String(p.rel)))return 0;
    if(netOnly&&!isNet(p))return 0;
    if(curTag&&!p.tags.some(t=>t.toLowerCase()===curTag))return 0;
    return q.every(w=>(p._h||'').includes(w))});
  const s=$('#fSort').value;
  r.sort((a,b)=>s==='year'?(b.year+'').localeCompare(a.year+''):s==='au'?a.authors.localeCompare(b.authors,'ru')
    :s==='folder'?(a.folder+a.title).localeCompare(b.folder+b.title,'ru'):(b.rel-a.rel)||a.title.localeCompare(b.title,'ru'));
  return r;
}
function renderList(){
  const r=filtered(),box=$('#items');box.textContent='';
  $('#cnt').textContent=r.length+' из '+DOC.papers.length+(curTag?' · тег: '+curTag:'');
  r.forEach(p=>{
    const d=E('div','it'+(cur===p?' sel':''));d.append(E('div','dot d'+(p.status||0)));
    const w=E('div');w.style.minWidth=0;
    w.append(E('b',null,(p.authors.split(',')[0]||'').trim().split(' ')[0]+' '+p.year+' '+'★'.repeat(p.rel)),E('small',null,p.title.slice(0,92)));
    d.append(w);d.onclick=()=>open_(p);box.append(d)});
  const done=DOC.papers.filter(p=>p.status===2).length,rd=DOC.papers.filter(p=>p.status===1).length;
  $('#prog').style.width=(done/DOC.papers.length*100).toFixed(1)+'%';
  $('#progTx').textContent='прочитано '+done+' / '+DOC.papers.length+(rd?' · читаю '+rd:'');
}
['#q','#fFolder','#fStatus','#fRel','#fSort'].forEach(s=>$(s).addEventListener('input',renderList));
$('#btnNet').onclick=e=>{netOnly=!netOnly;e.target.classList.toggle('on',netOnly);renderList()};
$('#btnTags').onclick=e=>{
  const tb=$('#tagbox');if(tb.style.display==='block'){tb.style.display='none';return}
  const c={};DOC.papers.forEach(p=>p.tags.forEach(t=>c[t]=(c[t]||0)+1));
  const all=Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ru'));
  tb.textContent='';
  const inp=E('input');inp.type='search';inp.placeholder='найти слово…';inp.style.cssText='width:220px;padding:3px 7px;font-size:12.5px';
  const b0=E('button','mini','сбросить');b0.style.marginLeft='6px';
  b0.onclick=()=>{curTag='';tb.style.display='none';renderList();if(cur)open_(cur)};
  const box=E('div');box.style.cssText='margin-top:7px;max-height:40vh;overflow:auto';
  const draw=()=>{const f=inp.value.trim().toLowerCase();box.textContent='';
    const list=all.filter(([t])=>!f||t.toLowerCase().includes(f));
    if(!list.length){box.append(E('span','sv','ничего не найдено'));return}
    list.slice(0,400).forEach(([t,n])=>{const s2=E('span','tag'+(curTag===t.toLowerCase()?' sel':''),t+' ('+n+')');
      s2.onclick=()=>{curTag=t.toLowerCase();tb.style.display='none';renderList();if(cur)open_(cur)};box.append(s2)})};
  inp.oninput=draw;tb.append(inp,b0,box);draw();
  const r=e.target.getBoundingClientRect();tb.style.left=Math.max(6,r.left-170)+'px';tb.style.top=(r.bottom+4)+'px';tb.style.display='block';
  setTimeout(()=>inp.focus(),30)};
</script>
<script>
/* ---------- редактор блоков ---------- */
const TYPES=[['p','Текст'],['h','Заголовок'],['li','Пункт'],['quote','Цитата']];
const COLORS=[['','без цвета','transparent'],['blue','голубая','var(--accbg)'],['green','зелёная','var(--okbg)'],
 ['yellow','жёлтая','var(--warnbg)'],['pink','розовая','var(--pinkbg)'],['violet','сиреневая','var(--violetbg)'],
 ['teal','бирюзовая','var(--tealbg)'],['gray','серая','var(--graybg)']];
const SYMS=[
 ['Значки','👍 👎 ✅ ❌ ❗ ❓ ⚠️ 📌 📎 ⭐ 🔥 💡 🔑 ✔️ ✖️ ➕ ➖ 🚩 🔔 ⏱️ 📅 🧠 💭 👀 ✍️'],
 ['Работа','📖 📚 📝 📄 📑 🗂️ 📊 📈 📉 🔬 🔭 🧪 ⚗️ 🧫 🧬 💉 🌡️ ⚖️ 🖥️ 💾 🔎 🏷️'],
 ['Растения и холод','🌱 🌿 🍃 🌾 🌳 🌸 🍏 🍎 🍐 🍒 🫐 ❄️ 🧊 🥶 ☀️ 💧 🌧️ 🌡️ 🍂 🌰'],
 ['Стрелки','→ ← ↑ ↓ ↔ ⇒ ⇐ ⇔ ↗ ↘ ⟶ ⤷ ▶ ◀ ▲ ▼ ⟳ ⟲'],
 ['Наука','α β γ δ ε ζ η θ κ λ μ ν π ρ σ τ φ χ ψ ω Δ Σ Ω Φ Ψ'],
 ['Знаки','± × ÷ ≈ ≠ ≤ ≥ ∼ ∞ ° ′ ″ ‰ √ ∑ ∫ ∆ · • ◦ ‣ § № † ‡ ¹ ² ³ ₀ ₁ ₂ ₃ ₄ ½ ¼ ¾ « » — – … ™ ©']
];
let focusIdx=-1;
const clean=h=>{const d=document.createElement('div');d.innerHTML=h;
  (function walk(n){[...n.childNodes].forEach(c=>{
    if(c.nodeType===1){const t=c.tagName.toLowerCase();
      if(!['b','strong','i','em','u','s','mark','sup','sub','br'].includes(t)){const f=document.createDocumentFragment();while(c.firstChild)f.append(c.firstChild);c.replaceWith(f);walk(n)}
      else{[...c.attributes].forEach(a=>c.removeAttribute(a.name));walk(c)}}})})(d);
  return d.innerHTML};

function blockEl(p,b,i){
  if(b.t==='img'){
    const w=E('div','imgb');const im=E('img');im.src=b.src;w.append(im);
    const g=E('div','row');const del=E('button','mini','удалить картинку');
    del.onclick=()=>{p.blocks.splice(i,1);save();drawDoc(p)};g.append(del);w.append(g);return w}
  const mk=()=>{

<script>
/* ---------- PDF ---------- */
let pdfOn=false,wide=false,scale=1.1,curDoc=null,curFile='',curPg=1,pendQ='';
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='pdfjs/pdf.worker.min.js';
function layout(){$('#main').className=wide?'pdfmax':(pdfOn?'pdf':'');$('#btnPdf').classList.toggle('on',pdfOn||wide)}
$('#btnPdf').onclick=()=>{pdfOn=!pdfOn;wide=false;layout();if(pdfOn&&cur)openPdf(cur,curPg)};
$('#pFold').onclick=()=>{pdfOn=false;wide=false;layout()};

$('#pPrev').onclick=()=>{if(curPg>1){curPg--;render()}};

$('#pIn').onchange=()=>{const n=+$('#pIn').value;if(curDoc&&n>=1&&n<=curDoc.numPages){curPg=n;render()}};
$('#pZi').onclick=()=>{scale=Math.min(4,scale*1.2);render()};

function msg(h){$('#pmsg').innerHTML='';if(h)$('#pmsg').append(h)}
async function fileFor(p){
  if(files[p.file])return files[p.file];
  const base=p.file.split('/').pop();
  for(const k in files)if(k.split('/').pop()===base)return files[k];
  return null;
}
async function openPdf(p,page,quote){
  if(!pdfOn&&!wide){pdfOn=true;layout()}
  pendQ=quote||'';curPg=page||1;
  const qb=$('#qbar');
  if(quote){qb.textContent='';qb.append(E('span',null,'« '+quote+' »  '));
    const t=E('button','mini','перевести');t.onclick=async()=>{t.textContent='…';const r=await tr(quote,'en','ru');t.replaceWith(E('i',null,' → '+r))};
    qb.append(t);qb.classList.add('show')}else qb.classList.remove('show');
  if(curFile===p.file&&curDoc){render();return}
  curDoc=null;curFile=p.file;{const cx=$('#pcv').getContext('2d');if(cx)cx.clearRect(0,0,9999,9999)}$('#ptext').textContent='';
  if(!window.pdfjsLib){msg(E('span',null,'Файлы pdfjs не найдены рядом со страницей.'));return}
  const f=await fileFor(p);
  try{

    const r=E('div','row');r.append(btnFolder(),(()=>{const b=E('button','mini','Открыть в новой вкладке');b.onclick=()=>window.open(p.file.split('/').map(encodeURIComponent).join('/')+'#page='+curPg,'_blank');return b})());
    w.append(r);msg(w)}
}
async function render(){
  if(!curDoc)return;
  const pg=await curDoc.getPage(curPg);
  const vp=pg.getViewport({scale});
  const cv=$('#pcv'),dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.floor(vp.width*dpr);cv.height=Math.floor(vp.height*dpr);
  cv.style.width=vp.width+'px';cv.style.height=vp.height+'px';
  $('#pstage').style.width=vp.width+'px';$('#pstage').style.height=vp.height+'px';
  const ctx=cv.getContext('2d');if(!ctx)return;ctx.setTransform(dpr,0,0,dpr,0,0);
  await pg.render({canvasContext:ctx,viewport:vp}).promise;
  $('#pIn').value=curPg;$('#pTot').textContent='/ '+curDoc.numPages;$('#pZt').textContent=Math.round(scale*100)+'%';
  const tl=$('#ptext');tl.textContent='';tl.style.width=vp.width+'px';tl.style.height=vp.height+'px';
  $('#pstage').style.setProperty('--scale-factor',scale);tl.style.setProperty('--scale-factor',scale);
  const tc=await pg.getTextContent();const divs=[];
  try{await pdfjsLib.renderTextLayer({textContentSource:tc,container:tl,viewport:vp,textDivs:divs}).promise}
  catch(e){try{await pdfjsLib.renderTextLayer({textContent:tc,container:tl,viewport:vp,textDivs:divs}).promise}catch(e2){}}
  if(pendQ)highlight(pendQ);
}
function highlight(q){
  const spans=[...$('#ptext').querySelectorAll('span')];
  let str='',map=[];
  spans.forEach((el,i)=>{const t=(el.textContent||'').toLowerCase().replace(/[^a-z0-9\u0430-\u044f\u0451]/gi,'');
    for(const ch of t){str+=ch;map.push(i)}});
  const nq=(q||'').toLowerCase().replace(/[^a-z0-9\u0430-\u044f\u0451]/gi,'');
  if(nq.length<6)return;
  let k=-1;
  for(const n of [24,16,12]){const h=nq.slice(0,n);if(h.length<7)continue;k=str.indexOf(h);if(k>=0)break}
  if(k<0)return;
  const tl=Math.min(20,Math.max(8,Math.floor(nq.length/3)));
  let e=str.indexOf(nq.slice(-tl),k);
  e=e>=0?e+tl:Math.min(str.length,k+nq.length);
  const a=map[k],b=map[Math.min(map.length-1,e-1)];
  for(let i=a;i<=b;i++)spans[i]&&spans[i].classList.add('hl');
  if(spans[a])spans[a].scrollIntoView({block:'center'});
}

function btnFolder(){

  b.onclick=async()=>{
    if(window.showDirectoryPicker){
      try{const dir=await window.showDirectoryPicker();const out={};
        const walk=async(d,pre)=>{for await(const [n,h] of d.entries()){const path=pre?pre+'/'+n:n;
          if(h.kind==='file'&&n.toLowerCase().endsWith('.pdf'))out[path]=await h.getFile();else if(h.kind==='directory')await walk(h,path)}};

    inp.onchange=()=>{const out={};[...inp.files].forEach(f=>{if(!f.name.toLowerCase().endsWith('.pdf'))return;
      const rp=(f.webkitRelativePath||f.name).split('/').slice(1).join('/')||f.name;out[rp]=f});files=out;afterFolder()};
    inp.click()};
  return b;
}

<script>

function applyFs(){FS=Math.max(11,Math.min(26,FS));$('#note').style.fontSize=FS+'px';LSset('dhn_fs',FS)}
$('#btnFsm').onclick=()=>{FS-=1;applyFs()};
$('#btnFsp').onclick=()=>{FS+=1;applyFs()};
applyFs();
$('#btnDark').onclick=()=>{const d=document.documentElement.hasAttribute('data-dark');
  d?document.documentElement.removeAttribute('data-dark'):document.documentElement.setAttribute('data-dark','');LSset('dhn_dark',d?'':'1')};
if(LSget('dhn_dark'))document.documentElement.setAttribute('data-dark','');
document.addEventListener('keydown',e=>{
  if(/^(TEXTAREA|INPUT)$/.test(e.target.tagName)||e.target.isContentEditable)return;
  if(!DOC)return;const r=filtered(),i=r.indexOf(cur);
  if(e.key==='j'&&i<r.length-1)open_(r[i+1]);
  if(e.key==='k'&&i>0)open_(r[i-1]);
  if(e.key==='p')$('#btnPdf').click()});
window.addEventListener('beforeunload',e=>{if(dirty){}});

/* ---------- старт ---------- */
(function(){
  const raw=LSget(KEY);
  if(raw){try{loadDoc(JSON.parse(raw));$('#sv').textContent='заметки из браузера';}catch(e){$('#boot').style.display='flex'}}
  else $('#boot').style.display='flex';
  msg((()=>{const w=E('div');w.append(E('span',null,'Чтобы PDF открывались прямо здесь: '));w.append(btnFolder());return w})());
  layout();
})();
</script>
